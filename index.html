<!doctype html>
<html lang="de-AT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="app-commit" content="%APP_COMMIT%">
    <link rel="icon" href="data:,">
    <title data-i18n="app.title">Brillenglas-Rechner</title>
    <script type="module" src="./src/ui/main.js"></script>
  </head>
  <body>
    <header>
      <h1 data-i18n="app.title">Brillenglas-Rechner</h1>
    </header>
    <main>
      <form id="rx" novalidate>
        <table class="rx-table">
          <caption data-i18n="rx.caption"></caption>
          <thead>
            <tr>
              <th scope="col" data-i18n="rx.eye"></th>
              <th scope="col">
                <abbr data-i18n="rx.sph.abbr" data-i18n-title="rx.sph.title"></abbr>
                <span data-i18n="rx.sph.unit"></span>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row" data-i18n="rx.od"></th>
              <td>
                <label for="rx-od-sph" class="visually-hidden" data-i18n="rx.od.sph.label"></label>
                <input id="rx-od-sph" name="od-sph" type="text" inputmode="decimal" autocomplete="off"
                  aria-describedby="rx-od-sph-echo rx-od-sph-err">
                <output id="rx-od-sph-echo" for="rx-od-sph"></output>
                <p id="rx-od-sph-err" class="error" aria-live="polite" hidden></p>
              </td>
            </tr>
            <tr>
              <th scope="row" data-i18n="rx.os"></th>
              <td>
                <label for="rx-os-sph" class="visually-hidden" data-i18n="rx.os.sph.label"></label>
                <input id="rx-os-sph" name="os-sph" type="text" inputmode="decimal" autocomplete="off"
                  aria-describedby="rx-os-sph-echo rx-os-sph-err">
                <output id="rx-os-sph-echo" for="rx-os-sph"></output>
                <p id="rx-os-sph-err" class="error" aria-live="polite" hidden></p>
              </td>
            </tr>
          </tbody>
        </table>
        <p id="rx-hint" data-i18n="rx.sph.label"></p>
        <div class="field">
          <label for="material" data-i18n="material.label"></label>
          <select id="material" name="material" aria-describedby="material-hint"></select>
          <p id="material-hint" data-i18n="material.hint"></p>
        </div>
      </form>

      <p id="frame-note" data-i18n="frame.note"></p>

      <section id="result" aria-labelledby="result-title">
        <h2 id="result-title" data-i18n="result.title"></h2>
        <table class="result-table">
          <thead>
            <tr>
              <td></td>
              <th scope="col" data-i18n="rx.od"></th>
              <th scope="col" data-i18n="rx.os"></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row" data-i18n="result.ct"></th>
              <td id="result-od-ct"></td>
              <td id="result-os-ct"></td>
            </tr>
            <tr>
              <th scope="row" data-i18n="result.etmax"></th>
              <td id="result-od-etmax"></td>
              <td id="result-os-etmax"></td>
            </tr>
            <tr>
              <th scope="row" data-i18n="result.etmin"></th>
              <td id="result-od-etmin"></td>
              <td id="result-os-etmin"></td>
            </tr>
            <tr>
              <th scope="row" data-i18n="result.weight"></th>
              <td id="result-od-weight"></td>
              <td id="result-os-weight"></td>
            </tr>
            <tr>
              <th scope="row" data-i18n="result.basecurve"></th>
              <td id="result-od-basecurve"></td>
              <td id="result-os-basecurve"></td>
            </tr>
            <tr>
              <th scope="row" data-i18n="result.status"></th>
              <td id="result-od-status"></td>
              <td id="result-os-status"></td>
            </tr>
          </tbody>
        </table>
        <p id="result-od-material" class="material-line"></p>
        <p id="result-os-material" class="material-line"></p>
        <aside id="disclaimer" aria-labelledby="disclaimer-title">
          <h3 id="disclaimer-title" data-i18n="disclaimer.title"></h3>
          <p data-i18n="disclaimer.body"></p>
        </aside>
      </section>

      <details id="tech">
        <summary data-i18n="tech.summary"></summary>
        <p id="timing"></p>
        <p id="timing-worst"></p>
        <p id="timing-input"></p>
        <button type="button" id="timing-rerun" data-i18n="tech.rerun"></button>
        <p id="ua"></p>
      </details>
    </main>
    <footer>
      <span data-i18n="footer.version"></span> <span id="app-commit"></span>
    </footer>
  </body>
</html>
