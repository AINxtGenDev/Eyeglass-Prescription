<!doctype html>
<html lang="de-AT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <meta name="app-commit" content="%APP_COMMIT%">
    <link rel="icon" href="data:,">
    <title data-i18n="app.title">Brillenglas-Rechner</title>
    <script type="module" src="./src/ui/main.js"></script>
  </head>
  <body>
    <header>
      <h1 data-i18n="app.title">Brillenglas-Rechner</h1>
      <div class="expert-switch">
        <input type="checkbox" role="switch" id="expert" aria-describedby="expert-hint">
        <label for="expert" data-i18n="expert.switch"></label>
        <p id="expert-hint" data-i18n="expert.hint"></p>
      </div>
    </header>
    <main class="layout">
      <div class="layout-cols">
        <div class="col-inputs">
          <div id="example-banner">
            <p data-i18n="example.banner"></p>
            <button type="button" id="example-clear" data-i18n="example.clear"></button>
          </div>
          <form id="rx" novalidate>
            <div id="rx-presets" class="presets" role="group" aria-labelledby="rx-presets-label">
              <span id="rx-presets-label" class="presets-label" data-i18n="preset.rx.label"></span>
              <div class="chips"></div>
            </div>
            <div id="rx-preset-confirm-slot"></div>
            <table id="rx-table" class="rx-table">
              <caption data-i18n="rx.caption"></caption>
              <thead>
                <tr>
                  <th scope="col" data-i18n="rx.eye"></th>
                  <th scope="col">
                    <span class="term"><abbr data-i18n="rx.sph.abbr" data-i18n-title="rx.sph.title"></abbr>
                      <span data-i18n="rx.sph.unit"></span><button type="button" class="tip-btn" aria-expanded="false"
                        aria-controls="tip-sph" data-i18n-aria-label="tip.sph.name"></button></span>
                  </th>
                  <th scope="col">
                    <span class="term"><abbr data-i18n="rx.cyl.abbr" data-i18n-title="rx.cyl.title"></abbr>
                      <span data-i18n="rx.sph.unit"></span><button type="button" class="tip-btn" aria-expanded="false"
                        aria-controls="tip-cyl" data-i18n-aria-label="tip.cyl.name"></button></span>
                  </th>
                  <th scope="col">
                    <span class="term"><abbr data-i18n="rx.axis.abbr" data-i18n-title="rx.axis.title"></abbr>
                      <span data-i18n="rx.axis.unit"></span><button type="button" class="tip-btn" aria-expanded="false"
                        aria-controls="tip-axis" data-i18n-aria-label="tip.axis.name"></button></span>
                  </th>
                  <th scope="col">
                    <span class="term"><span data-i18n="rx.pd.header"></span><button type="button" class="tip-btn" aria-expanded="false"
                        aria-controls="tip-pd" data-i18n-aria-label="tip.pd.name"></button></span>
                  </th>
                </tr>
                <tr class="tip-row" hidden>
                  <td colspan="5"><p id="tip-sph" class="tip" hidden data-i18n="tip.sph.text"></p></td>
                </tr>
                <tr class="tip-row" hidden>
                  <td colspan="5"><p id="tip-cyl" class="tip" hidden data-i18n="tip.cyl.text"></p></td>
                </tr>
                <tr class="tip-row" hidden>
                  <td colspan="5"><p id="tip-axis" class="tip" hidden data-i18n="tip.axis.text"></p></td>
                </tr>
                <tr class="tip-row" hidden>
                  <td colspan="5"><p id="tip-pd" class="tip" hidden data-i18n="tip.pd.text"></p></td>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <th scope="row" data-i18n="rx.od"></th>
                  <td>
                    <label for="rx-od-sph" class="cell-label" data-i18n="rx.od.sph.label"></label>
                    <span class="input-group">
                      <button type="button" class="sign" data-for="rx-od-sph" data-i18n-aria-label="rx.sign.od.sph">±</button>
                      <input id="rx-od-sph" name="od-sph" type="text" inputmode="decimal" autocomplete="off"
                        aria-describedby="rx-od-sph-echo rx-od-sph-err">
                    </span>
                    <output id="rx-od-sph-echo" for="rx-od-sph"></output>
                    <div id="rx-od-sph-err" class="msg" aria-live="polite" hidden></div>
                  </td>
                  <td>
                    <label for="rx-od-cyl" class="cell-label" data-i18n="rx.od.cyl.label"></label>
                    <span class="input-group">
                      <button type="button" class="sign" data-for="rx-od-cyl" data-i18n-aria-label="rx.sign.od.cyl">±</button>
                      <input id="rx-od-cyl" name="od-cyl" type="text" inputmode="decimal" autocomplete="off"
                        aria-describedby="rx-od-cyl-echo rx-od-cyl-err">
                    </span>
                    <output id="rx-od-cyl-echo" for="rx-od-cyl"></output>
                    <div id="rx-od-cyl-err" class="msg" aria-live="polite" hidden></div>
                  </td>
                  <td>
                    <label for="rx-od-axis" class="cell-label" data-i18n="rx.od.axis.label"></label>
                    <span class="input-group">
                      <input id="rx-od-axis" name="od-axis" type="text" inputmode="numeric" autocomplete="off"
                        aria-describedby="rx-od-axis-echo rx-od-axis-err">
                    </span>
                    <output id="rx-od-axis-echo" for="rx-od-axis"></output>
                    <div id="rx-od-axis-err" class="msg" aria-live="polite" hidden></div>
                  </td>
                  <td>
                    <label for="rx-od-pd" class="cell-label" data-i18n="rx.od.pd.label"></label>
                    <span class="input-group">
                      <input id="rx-od-pd" name="od-pd" type="text" inputmode="decimal" autocomplete="off"
                        aria-describedby="rx-od-pd-echo rx-od-pd-err">
                    </span>
                    <output id="rx-od-pd-echo" for="rx-od-pd"></output>
                    <div id="rx-od-pd-err" class="msg" aria-live="polite" hidden></div>
                  </td>
                </tr>
                <tr>
                  <th scope="row" data-i18n="rx.os"></th>
                  <td>
                    <label for="rx-os-sph" class="cell-label" data-i18n="rx.os.sph.label"></label>
                    <span class="input-group">
                      <button type="button" class="sign" data-for="rx-os-sph" data-i18n-aria-label="rx.sign.os.sph">±</button>
                      <input id="rx-os-sph" name="os-sph" type="text" inputmode="decimal" autocomplete="off"
                        aria-describedby="rx-os-sph-echo rx-os-sph-err">
                    </span>
                    <output id="rx-os-sph-echo" for="rx-os-sph"></output>
                    <div id="rx-os-sph-err" class="msg" aria-live="polite" hidden></div>
                  </td>
                  <td>
                    <label for="rx-os-cyl" class="cell-label" data-i18n="rx.os.cyl.label"></label>
                    <span class="input-group">
                      <button type="button" class="sign" data-for="rx-os-cyl" data-i18n-aria-label="rx.sign.os.cyl">±</button>
                      <input id="rx-os-cyl" name="os-cyl" type="text" inputmode="decimal" autocomplete="off"
                        aria-describedby="rx-os-cyl-echo rx-os-cyl-err">
                    </span>
                    <output id="rx-os-cyl-echo" for="rx-os-cyl"></output>
                    <div id="rx-os-cyl-err" class="msg" aria-live="polite" hidden></div>
                  </td>
                  <td>
                    <label for="rx-os-axis" class="cell-label" data-i18n="rx.os.axis.label"></label>
                    <span class="input-group">
                      <input id="rx-os-axis" name="os-axis" type="text" inputmode="numeric" autocomplete="off"
                        aria-describedby="rx-os-axis-echo rx-os-axis-err">
                    </span>
                    <output id="rx-os-axis-echo" for="rx-os-axis"></output>
                    <div id="rx-os-axis-err" class="msg" aria-live="polite" hidden></div>
                  </td>
                  <td>
                    <label for="rx-os-pd" class="cell-label" data-i18n="rx.os.pd.label"></label>
                    <span class="input-group">
                      <input id="rx-os-pd" name="os-pd" type="text" inputmode="decimal" autocomplete="off"
                        aria-describedby="rx-os-pd-echo rx-os-pd-err">
                    </span>
                    <output id="rx-os-pd-echo" for="rx-os-pd"></output>
                    <div id="rx-os-pd-err" class="msg" aria-live="polite" hidden></div>
                  </td>
                </tr>
              </tbody>
            </table>
            <div class="rx-same">
              <input type="checkbox" id="rx-same">
              <label for="rx-same" data-i18n="rx.same"></label>
              <p id="rx-mirror-note" data-i18n="rx.mirrored" hidden></p>
            </div>
            <p id="rx-od-forms" class="rx-forms" aria-live="polite" hidden></p>
            <p id="rx-os-forms" class="rx-forms" aria-live="polite" hidden></p>
            <details id="rx-other">
              <summary data-i18n="rx.other.summary"></summary>
              <p data-i18n="rx.other.intro"></p>
              <dl>
                <dt data-i18n="rx.other.add.term"></dt>
                <dd data-i18n="rx.other.add.text"></dd>
                <dt data-i18n="rx.other.prism.term"></dt>
                <dd data-i18n="rx.other.prism.text"></dd>
                <dt data-i18n="rx.other.hsa.term"></dt>
                <dd data-i18n="rx.other.hsa.text"></dd>
                <dt data-i18n="rx.other.fn.term"></dt>
                <dd data-i18n="rx.other.fn.text"></dd>
                <dt data-i18n="rx.other.ep.term"></dt>
                <dd data-i18n="rx.other.ep.text"></dd>
              </dl>
            </details>
          </form>
          <section id="frame-section" aria-labelledby="frame-title">
            <h2 id="frame-title" data-i18n="frame.title"></h2>
            <div class="frame">
              <div class="field field-stamp">
                <span class="term"><label for="frame-stamp" data-i18n="stamp.label"></label><button type="button" class="tip-btn"
                    aria-expanded="false" aria-controls="tip-stamp" data-i18n-aria-label="tip.stamp.name"></button></span>
                <p id="tip-stamp" class="tip" hidden data-i18n="tip.stamp.text"></p>
                <p id="frame-stamp-hint" class="field-hint" data-i18n="stamp.hint"></p>
                <input id="frame-stamp" name="frame-stamp" type="text" autocomplete="off" spellcheck="false"
                  aria-describedby="frame-stamp-hint frame-stamp-echo frame-stamp-err">
                <output id="frame-stamp-echo" for="frame-stamp"></output>
                <div id="frame-stamp-err" class="msg" aria-live="polite" hidden></div>
                <button type="button" id="frame-stamp-help" class="link-button" aria-expanded="false"
                  aria-controls="frame-stamp-figure" data-i18n="stamp.help"></button>
                <figure id="frame-stamp-figure" hidden>
                  <div id="frame-stamp-svg"></div>
                  <figcaption data-i18n="stamp.figcaption"></figcaption>
                </figure>
              </div>
              <fieldset id="frame-shape">
                <legend data-i18n="frame.shape.legend"></legend>
                <div class="shape-cards"></div>
              </fieldset>
              <div id="frame-presets" class="presets" role="group" aria-labelledby="frame-presets-label">
                <span id="frame-presets-label" class="presets-label" data-i18n="preset.frame.label"></span>
                <div class="chips"></div>
              </div>
              <div id="frame-preset-confirm-slot"></div>
              <button type="button" id="frame-defaults" class="link-button" hidden></button>
              <h3 data-i18n="frame.single"></h3>
              <div class="frame-dims">
                <div class="field">
                  <span class="term"><label for="frame-a" data-i18n="frame.a.label"></label><button type="button" class="tip-btn"
                      aria-expanded="false" aria-controls="tip-a" data-i18n-aria-label="tip.a.name"></button></span>
                  <p id="tip-a" class="tip" hidden data-i18n="tip.a.text"></p>
                  <input id="frame-a" name="frame-a" type="text" inputmode="decimal" autocomplete="off"
                    aria-describedby="frame-a-echo frame-a-err">
                  <output id="frame-a-echo" for="frame-a"></output>
                  <div id="frame-a-err" class="msg" aria-live="polite" hidden></div>
                </div>
                <div class="field">
                  <span class="term"><label for="frame-b" data-i18n="frame.b.label"></label><button type="button" class="tip-btn"
                      aria-expanded="false" aria-controls="tip-b" data-i18n-aria-label="tip.b.name"></button></span>
                  <p id="tip-b" class="tip" hidden data-i18n="tip.b.text"></p>
                  <input id="frame-b" name="frame-b" type="text" inputmode="decimal" autocomplete="off"
                    aria-describedby="frame-b-echo frame-b-err">
                  <output id="frame-b-echo" for="frame-b"></output>
                  <div id="frame-b-err" class="msg" aria-live="polite" hidden></div>
                </div>
                <div class="field">
                  <span class="term"><label for="frame-dbl" data-i18n="frame.dbl.label"></label><button type="button" class="tip-btn"
                      aria-expanded="false" aria-controls="tip-dbl" data-i18n-aria-label="tip.dbl.name"></button></span>
                  <p id="tip-dbl" class="tip" hidden data-i18n="tip.dbl.text"></p>
                  <input id="frame-dbl" name="frame-dbl" type="text" inputmode="decimal" autocomplete="off"
                    aria-describedby="frame-dbl-echo frame-dbl-err">
                  <output id="frame-dbl-echo" for="frame-dbl"></output>
                  <div id="frame-dbl-err" class="msg" aria-live="polite" hidden></div>
                </div>
              </div>
              <div id="frame-rim-wrap" data-expert hidden>
                <span class="expert-tag" data-i18n="expert.tag"></span>
                <div class="field">
                  <span class="term"><label for="frame-rim" data-i18n="frame.rim.label"></label><button type="button" class="tip-btn"
                      aria-expanded="false" aria-controls="tip-rim" data-i18n-aria-label="tip.rim.name"></button></span>
                  <p id="tip-rim" class="tip" hidden data-i18n="tip.rim.text"></p>
                  <p id="frame-rim-note" class="field-hint"></p>
                  <input id="frame-rim" name="frame-rim" type="text" inputmode="decimal" autocomplete="off" value="3,0"
                    aria-describedby="frame-rim-note frame-rim-echo frame-rim-err">
                  <output id="frame-rim-echo" for="frame-rim"></output>
                  <div id="frame-rim-err" class="msg" aria-live="polite" hidden></div>
                </div>
                <div id="frame-rim-result" class="small">
                  <p id="frame-rim-result-od"></p>
                  <p id="frame-rim-result-os"></p>
                </div>
              </div>
            </div>
          </section>
          <section id="material-section" aria-labelledby="material-title">
            <h2 id="material-title" data-i18n="material.title"></h2>
            <fieldset id="material" aria-describedby="material-hint">
              <legend><span class="term"><span data-i18n="material.legend"></span><button type="button" class="tip-btn"
                    aria-expanded="false" aria-controls="tip-index" data-i18n-aria-label="tip.index.name"></button></span></legend>
              <p id="tip-index" class="tip" hidden data-i18n="tip.index.text"></p>
              <div class="material-cards">
                <label class="radio-card material-card" id="material-custom-card" data-expert hidden>
                  <input type="radio" name="material" value="custom">
                  <span class="radio-card-name" data-i18n="material.custom.title"></span>
                  <span class="radio-card-sub" data-i18n="material.custom.sub"></span>
                </label>
              </div>
            </fieldset>
            <div id="material-err" class="msg msg-hint" aria-live="polite" hidden></div>
            <fieldset id="custom-material" hidden>
              <legend><span class="expert-tag" data-i18n="expert.tag"></span> <span data-i18n="material.custom.legend"></span></legend>
              <div class="field">
                <span class="term"><label for="custom-ne" data-i18n="material.custom.ne.label"></label><button type="button" class="tip-btn"
                    aria-expanded="false" aria-controls="tip-ne" data-i18n-aria-label="tip.ne.name"></button></span>
                <p id="tip-ne" class="tip" hidden data-i18n="tip.ne.text"></p>
                <input id="custom-ne" name="custom-ne" type="text" inputmode="decimal" autocomplete="off"
                  aria-describedby="custom-ne-echo custom-ne-err">
                <output id="custom-ne-echo" for="custom-ne"></output>
                <div id="custom-ne-err" class="msg" aria-live="polite" hidden></div>
              </div>
              <div class="field">
                <span class="term"><label for="custom-density" data-i18n="material.custom.density.label"></label></span>
                <input id="custom-density" name="custom-density" type="text" inputmode="decimal" autocomplete="off"
                  aria-describedby="custom-density-echo custom-density-err">
                <output id="custom-density-echo" for="custom-density"></output>
                <div id="custom-density-err" class="msg" aria-live="polite" hidden></div>
              </div>
              <div class="field">
                <span class="term"><label for="custom-abbe" data-i18n="material.custom.abbe.label"></label></span>
                <input id="custom-abbe" name="custom-abbe" type="text" inputmode="decimal" autocomplete="off"
                  aria-describedby="custom-abbe-echo custom-abbe-err">
                <output id="custom-abbe-echo" for="custom-abbe"></output>
                <div id="custom-abbe-err" class="msg" aria-live="polite" hidden></div>
              </div>
              <div class="gs-min">
                <div class="field">
                  <span class="term"><label for="custom-min-ct" data-i18n="material.custom.minCT.label"></label></span>
                  <input id="custom-min-ct" name="custom-min-ct" type="text" inputmode="decimal" autocomplete="off"
                    aria-describedby="custom-min-ct-echo custom-min-ct-err">
                  <output id="custom-min-ct-echo" for="custom-min-ct"></output>
                  <div id="custom-min-ct-err" class="msg" aria-live="polite" hidden></div>
                </div>
                <div class="field">
                  <span class="term"><label for="custom-min-et" data-i18n="material.custom.minET.label"></label></span>
                  <input id="custom-min-et" name="custom-min-et" type="text" inputmode="decimal" autocomplete="off"
                    aria-describedby="custom-min-et-echo custom-min-et-err">
                  <output id="custom-min-et-echo" for="custom-min-et"></output>
                  <div id="custom-min-et-err" class="msg" aria-live="polite" hidden></div>
                </div>
              </div>
            </fieldset>
            <p id="material-hint" class="field-hint" data-i18n="material.hint"></p>
            <p class="term"><span data-i18n="material.abbeTerm"></span><button type="button" class="tip-btn"
                aria-expanded="false" aria-controls="tip-abbe" data-i18n-aria-label="tip.abbe.name"></button></p>
            <p id="tip-abbe" class="tip" hidden data-i18n="tip.abbe.text"></p>
            <div id="glass-settings" data-expert hidden>
              <span class="expert-tag" data-i18n="expert.tag"></span>
              <h3 data-i18n="expert.gs.title"></h3>
              <div class="field">
                <span class="term"><label for="expert-basecurve" data-i18n="expert.bc.label"></label><button type="button" class="tip-btn"
                    aria-expanded="false" aria-controls="tip-basecurve" data-i18n-aria-label="tip.basecurve.name"></button></span>
                <p id="tip-basecurve" class="tip" hidden data-i18n="tip.basecurve.text"></p>
                <input id="expert-basecurve" name="expert-basecurve" type="text" inputmode="decimal" autocomplete="off"
                  aria-describedby="expert-basecurve-echo expert-basecurve-err">
                <output id="expert-basecurve-echo" for="expert-basecurve"></output>
                <div id="expert-basecurve-err" class="msg" aria-live="polite" hidden></div>
              </div>
              <div id="expert-bc-auto" class="small">
                <p id="expert-bc-auto-od"></p>
                <p id="expert-bc-auto-os"></p>
              </div>
              <p id="expert-bc-minus-note" class="small" data-i18n="expert.bc.minusNote" hidden></p>
              <button type="button" id="expert-bc-vogel" data-i18n="expert.bc.vogelApply"></button>
              <div class="gs-min" id="expert-min">
                <div class="field">
                  <span class="term"><label for="expert-min-ct" data-i18n="expert.min.ct"></label><button type="button" class="tip-btn"
                      aria-expanded="false" aria-controls="tip-minct" data-i18n-aria-label="tip.minct.name"></button></span>
                  <p id="tip-minct" class="tip" hidden data-i18n="tip.minct.text"></p>
                  <input id="expert-min-ct" name="expert-min-ct" type="text" inputmode="decimal" autocomplete="off"
                    aria-describedby="expert-min-ct-echo expert-min-ct-err">
                  <output id="expert-min-ct-echo" for="expert-min-ct"></output>
                  <div id="expert-min-ct-err" class="msg" aria-live="polite" hidden></div>
                </div>
                <div class="field">
                  <span class="term"><label for="expert-min-et" data-i18n="expert.min.et"></label><button type="button" class="tip-btn"
                      aria-expanded="false" aria-controls="tip-minet" data-i18n-aria-label="tip.minet.name"></button></span>
                  <p id="tip-minet" class="tip" hidden data-i18n="tip.minet.text"></p>
                  <input id="expert-min-et" name="expert-min-et" type="text" inputmode="decimal" autocomplete="off"
                    aria-describedby="expert-min-et-echo expert-min-et-err">
                  <output id="expert-min-et-echo" for="expert-min-et"></output>
                  <div id="expert-min-et-err" class="msg" aria-live="polite" hidden></div>
                </div>
              </div>
              <button type="button" id="expert-min-reset" data-i18n="expert.min.reset"></button>
              <div id="expert-binding-note" class="small">
                <p id="expert-binding-od"></p>
                <p id="expert-binding-os"></p>
              </div>
              <fieldset id="expert-front" class="segmented">
                <legend data-i18n="expert.front.legend"></legend>
                <label><input type="radio" name="expert-front" value="sph" checked><span data-i18n="expert.front.sph"></span></label>
                <label><input type="radio" name="expert-front" value="asph"><span data-i18n="expert.front.asph"></span></label>
              </fieldset>
              <div id="expert-k-wrap" hidden>
                <div class="field">
                  <span class="term"><label for="expert-k" data-i18n="expert.k.label"></label><button type="button" class="tip-btn"
                      aria-expanded="false" aria-controls="tip-k" data-i18n-aria-label="tip.k.name"></button></span>
                  <p id="tip-k" class="tip" hidden data-i18n="tip.k.text"></p>
                  <span class="input-group">
                    <button type="button" class="sign" data-for="expert-k" data-i18n-aria-label="rx.sign.expert-k">±</button>
                    <input id="expert-k" name="expert-k" type="text" inputmode="decimal" autocomplete="off" value="−1"
                      aria-describedby="expert-k-echo expert-k-err expert-asph-note">
                  </span>
                  <output id="expert-k-echo" for="expert-k"></output>
                  <div id="expert-k-err" class="msg" aria-live="polite" hidden></div>
                </div>
                <p id="expert-asph-note" class="small" data-i18n="expert.asph.note"></p>
              </div>
            </div>
          </section>
        </div>

        <div class="col-results" tabindex="0" role="region" data-i18n-aria-label="layout.results.region">
          <div id="view-slot" hidden></div>
          <section id="result" aria-labelledby="result-title">
