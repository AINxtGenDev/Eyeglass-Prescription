<!doctype html>
<html lang="de-AT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="app-commit" content="%APP_COMMIT%">
    <link rel="icon" href="data:,">
    <title data-i18n="app.title">Brillenglas-Rechner</title>
    <script type="module" src="./src/ui/main.js"></script>
  </head>
  <body>
    <header>
      <h1 data-i18n="app.title">Brillenglas-Rechner</h1>
    </header>
    <main>
      <form id="rx" novalidate>
        <table class="rx-table">
          <caption data-i18n="rx.caption"></caption>
          <thead>
            <tr>
              <th scope="col" data-i18n="rx.eye"></th>
              <th scope="col">
                <abbr data-i18n="rx.sph.abbr" data-i18n-title="rx.sph.title"></abbr>
                <span data-i18n="rx.sph.unit"></span>
              </th>
              <th scope="col">
                <abbr data-i18n="rx.cyl.abbr" data-i18n-title="rx.cyl.title"></abbr>
                <span data-i18n="rx.sph.unit"></span>
              </th>
              <th scope="col">
                <abbr data-i18n="rx.axis.abbr" data-i18n-title="rx.axis.title"></abbr>
                <span data-i18n="rx.axis.unit"></span>
              </th>
              <th scope="col" data-i18n="rx.pd.header"></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row" data-i18n="rx.od"></th>
              <td>
                <label for="rx-od-sph" class="visually-hidden" data-i18n="rx.od.sph.label"></label>
                <input id="rx-od-sph" name="od-sph" type="text" inputmode="decimal" autocomplete="off"
                  aria-describedby="rx-od-sph-echo rx-od-sph-err">
                <output id="rx-od-sph-echo" for="rx-od-sph"></output>
                <p id="rx-od-sph-err" class="error" aria-live="polite" hidden></p>
              </td>
              <td>
                <label for="rx-od-cyl" class="visually-hidden" data-i18n="rx.od.cyl.label"></label>
                <input id="rx-od-cyl" name="od-cyl" type="text" inputmode="decimal" autocomplete="off"
                  aria-describedby="rx-od-cyl-echo rx-od-cyl-err">
                <output id="rx-od-cyl-echo" for="rx-od-cyl"></output>
                <p id="rx-od-cyl-err" class="error" aria-live="polite" hidden></p>
              </td>
              <td>
                <label for="rx-od-axis" class="visually-hidden" data-i18n="rx.od.axis.label"></label>
                <input id="rx-od-axis" name="od-axis" type="text" inputmode="numeric" autocomplete="off"
                  aria-describedby="rx-od-axis-echo rx-od-axis-err">
                <output id="rx-od-axis-echo" for="rx-od-axis"></output>
                <p id="rx-od-axis-err" class="error" aria-live="polite" hidden></p>
              </td>
              <td>
                <label for="rx-od-pd" class="visually-hidden" data-i18n="rx.od.pd.label"></label>
                <input id="rx-od-pd" name="od-pd" type="text" inputmode="decimal" autocomplete="off"
                  aria-describedby="rx-od-pd-echo rx-od-pd-err">
                <output id="rx-od-pd-echo" for="rx-od-pd"></output>
                <p id="rx-od-pd-err" class="error" aria-live="polite" hidden></p>
              </td>
            </tr>
            <tr>
              <th scope="row" data-i18n="rx.os"></th>
              <td>
                <label for="rx-os-sph" class="visually-hidden" data-i18n="rx.os.sph.label"></label>
                <input id="rx-os-sph" name="os-sph" type="text" inputmode="decimal" autocomplete="off"
                  aria-describedby="rx-os-sph-echo rx-os-sph-err">
                <output id="rx-os-sph-echo" for="rx-os-sph"></output>
                <p id="rx-os-sph-err" class="error" aria-live="polite" hidden></p>
              </td>
              <td>
                <label for="rx-os-cyl" class="visually-hidden" data-i18n="rx.os.cyl.label"></label>
                <input id="rx-os-cyl" name="os-cyl" type="text" inputmode="decimal" autocomplete="off"
                  aria-describedby="rx-os-cyl-echo rx-os-cyl-err">
                <output id="rx-os-cyl-echo" for="rx-os-cyl"></output>
                <p id="rx-os-cyl-err" class="error" aria-live="polite" hidden></p>
              </td>
              <td>
                <label for="rx-os-axis" class="visually-hidden" data-i18n="rx.os.axis.label"></label>
                <input id="rx-os-axis" name="os-axis" type="text" inputmode="numeric" autocomplete="off"
                  aria-describedby="rx-os-axis-echo rx-os-axis-err">
                <output id="rx-os-axis-echo" for="rx-os-axis"></output>
                <p id="rx-os-axis-err" class="error" aria-live="polite" hidden></p>
              </td>
              <td>
                <label for="rx-os-pd" class="visually-hidden" data-i18n="rx.os.pd.label"></label>
                <input id="rx-os-pd" name="os-pd" type="text" inputmode="decimal" autocomplete="off"
                  aria-describedby="rx-os-pd-echo rx-os-pd-err">
                <output id="rx-os-pd-echo" for="rx-os-pd"></output>
                <p id="rx-os-pd-err" class="error" aria-live="polite" hidden></p>
              </td>
            </tr>
          </tbody>
        </table>
        <p id="rx-hint" data-i18n="rx.sph.label"></p>
        <p id="rx-cyl-hint" data-i18n="rx.cyl.label"></p>
        <p id="rx-axis-hint" data-i18n="rx.axis.label"></p>
        <p id="rx-od-forms" class="rx-forms" aria-live="polite" hidden></p>
        <p id="rx-os-forms" class="rx-forms" aria-live="polite" hidden></p>
        <div class="field">
          <label for="material" data-i18n="material.label"></label>
          <select id="material" name="material" aria-describedby="material-hint"></select>
          <p id="material-hint" data-i18n="material.hint"></p>
        </div>
        <fieldset id="frame">
          <legend data-i18n="frame.legend"></legend>
          <div class="field">
            <label for="frame-shape" data-i18n="frame.shape.label"></label>
            <select id="frame-shape" name="frame-shape" aria-describedby="frame-hint"></select>
          </div>
          <div class="field">
            <label for="frame-a" data-i18n="frame.a.label"></label>
            <input id="frame-a" name="frame-a" type="text" inputmode="decimal" autocomplete="off"
              aria-describedby="frame-a-echo frame-a-err">
            <output id="frame-a-echo" for="frame-a"></output>
            <p id="frame-a-err" class="error" aria-live="polite" hidden></p>
          </div>
          <div class="field">
            <label for="frame-b" data-i18n="frame.b.label"></label>
            <input id="frame-b" name="frame-b" type="text" inputmode="decimal" autocomplete="off"
              aria-describedby="frame-b-echo frame-b-err">
            <output id="frame-b-echo" for="frame-b"></output>
            <p id="frame-b-err" class="error" aria-live="polite" hidden></p>
          </div>
          <div class="field">
            <label for="frame-dbl" data-i18n="frame.dbl.label"></label>
            <input id="frame-dbl" name="frame-dbl" type="text" inputmode="decimal" autocomplete="off"
              aria-describedby="frame-dbl-echo frame-dbl-err">
            <output id="frame-dbl-echo" for="frame-dbl"></output>
            <p id="frame-dbl-err" class="error" aria-live="polite" hidden></p>
          </div>
          <p id="frame-hint" data-i18n="frame.hint"></p>
        </fieldset>
      </form>

      <section id="result" aria-labelledby="result-title">
        <h2 id="result-title" data-i18n="result.title"></h2>
        <table class="result-table">
          <thead>
            <tr>
              <td></td>
              <th scope="col" data-i18n="rx.od"></th>
              <th scope="col" data-i18n="rx.os"></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row" data-i18n="result.ct"></th>
              <td id="result-od-ct"></td>
              <td id="result-os-ct"></td>
            </tr>
            <tr>
              <th scope="row" data-i18n="result.etmax"></th>
              <td id="result-od-etmax"></td>
              <td id="result-os-etmax"></td>
            </tr>
            <tr>
              <th scope="row" data-i18n="result.etmin"></th>
              <td id="result-od-etmin"></td>
              <td id="result-os-etmin"></td>
            </tr>
            <tr>
              <th scope="row" data-i18n="result.dec"></th>
              <td id="result-od-dec"></td>
              <td id="result-os-dec"></td>
            </tr>
            <tr>
              <th scope="row" data-i18n="result.weight"></th>
              <td id="result-od-weight"></td>
              <td id="result-os-weight"></td>
            </tr>
            <tr>
              <th scope="row" data-i18n="result.basecurve"></th>
              <td id="result-od-basecurve"></td>
              <td id="result-os-basecurve"></td>
            </tr>
            <tr>
              <th scope="row" data-i18n="result.status"></th>
              <td id="result-od-status"></td>
              <td id="result-os-status"></td>
            </tr>
          </tbody>
        </table>
        <p id="calc-status" class="calc-status"></p>
        <div id="diag-od" class="diag" role="status"></div>
        <div id="diag-os" class="diag" role="status"></div>
        <p id="result-od-material" class="material-line"></p>
        <p id="result-os-material" class="material-line"></p>
        <aside id="disclaimer" aria-labelledby="disclaimer-title">
          <h3 id="disclaimer-title" data-i18n="disclaimer.title"></h3>
          <p data-i18n="disclaimer.body"></p>
        </aside>
      </section>

      <details id="tech">
        <summary data-i18n="tech.summary"></summary>
        <p id="compute-mode"></p>
        <p id="timing"></p>
        <p id="timing-frame"></p>
        <p id="timing-worst"></p>
        <p id="timing-input"></p>
        <button type="button" id="timing-rerun" data-i18n="tech.rerun"></button>
        <p id="ua"></p>
      </details>
    </main>
    <footer>
      <span data-i18n="footer.version"></span> <span id="app-commit"></span>
    </footer>
  </body>
</html>
